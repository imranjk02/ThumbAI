<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Thumba</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <a href="/" class="auth-logo">✦ Thumb<span>AI</span></a>
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Sign in</h1>
        <p class="auth-subtitle">Sign in to access your thumbnails and collection.</p>
        <form class="auth-form"  method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="auth-btn">Sign In →</button>
        </form>
        <p class="auth-switch">Don't have an account?<a href="/signup">Create Account</a></p>
        <a href="/" class="back-home">← Back to ThumbAI</a>
    </div>
</div>
</body>
</html>
