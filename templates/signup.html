<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Thumba</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <a href="/" class="auth-logo">✦ Thumb<span>AI</span></a>
        <p class="eyebrow", class="auth-logo" >CREATE ACCOUNT</p>
        <h1>Join Thumb<span>AI</span></h1>
        <p class="auth-subtitle">Create an account to save and manage your thumbnails.</p>
        <form class="auth-form" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>
            <button type="submit" class="auth-btn">Create Account →</button>
        </form>
        <p class="auth-switch">Already have an account?<a href="/signin">Sign In</a></p>
        <a href="/" class="back-home">← Back to ThumbAI</a>
    </div>
</div>
</body>
</html>
